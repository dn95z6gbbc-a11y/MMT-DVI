<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1B2A25"><title>Личный бюджет v3</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F1F3F0;color:#1B2A25;margin:0;padding:24px}.box{max-width:430px;margin:15vh auto;background:#FBFCFA;border:1px solid #D4D9D3;border-radius:18px;padding:22px}.box h1{font-family:Georgia,serif;margin-top:0}.muted{color:#6C7671;line-height:1.45}</style></head><body><div class="box"><h1>Личный бюджет</h1><div class="muted" id="status">Загружаю v3…</div></div><script>(async()=>{try{const fs=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];const ps=[];for(const f of fs){const r=await fetch('./app/'+f+'?v=3',{cache:'no-store'});if(!r.ok)throw new Error(f);ps.push(await r.text())}document.open();document.write(ps.join(''));document.close()}catch(e){document.getElementById('status').textContent='Не удалось загрузить приложение. Обнови страницу.'}})();</script></body></html>
