.prompt();await deferredInstall.userChoice;deferredInstall=null;btn.style.display='none'}else{alert('Обнови страницу один раз. Если кнопка не появится, открой меню Chrome → «Установить приложение».')}});window.addEventListener('appinstalled',()=>{if(btn)btn.style.display='none'})})();<\/script>`;h=h.replace('</body>',pwa+'</body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('status').textContent='Не удалось загрузить приложение. Обнови страницу.'}})();</script></body></html>
