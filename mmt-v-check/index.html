<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <title>MMT V-CHECK</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0f}
    iframe{display:block;border:0;width:100%;height:100%;background:#090b0f}
  </style>
</head>
<body>
  <iframe
    id="vcheckFrame"
    src="../ptp-checker/v30.html?build=83-async-podcast"
    title="MMT V-CHECK"
    allow="clipboard-read; clipboard-write"
  ></iframe>
  <script>
  (()=>{
    const frame=document.getElementById('vcheckFrame');
    let timer=null;
    let attempts=0;

    function injectIntoApp(){
      attempts++;
      try{
        const wrapperDoc=frame.contentDocument;
        const app=wrapperDoc?.getElementById('app');
        const appDoc=app?.contentDocument;
        const appWin=app?.contentWindow;
        if(!appDoc?.getElementById('form')||!appWin){
          if(attempts<80)return false;
          clearInterval(timer);
          return false;
        }

        function add(src,guard){
          if(appWin[guard])return;
          const s=appDoc.createElement('script');
          s.src=src;
          s.async=false;
          (appDoc.head||appDoc.documentElement).appendChild(s);
        }

        add('/MMT-DVI/ptp-checker/nonvideo-podcast-async-v1.js?v=83-async-podcast','__VCHECK_PODCAST_ASYNC_BRIDGE_V1__');
        add('/MMT-DVI/ptp-checker/nonvideo-engine-v1.js?v=83-async-podcast','__VCHECK_NONVIDEO_ENGINE_V1__');
        add('/MMT-DVI/ptp-checker/nonvideo-docx-compat-v1.js?v=82-docx-restore','__VCHECK_DOCX_COMPAT_V1__');
        clearInterval(timer);
        return true;
      }catch(error){
        if(attempts>=80)clearInterval(timer);
        return false;
      }
    }

    frame.addEventListener('load',()=>{
      attempts=0;
      clearInterval(timer);
      timer=setInterval(injectIntoApp,250);
      injectIntoApp();
    });
  })();
  </script>
</body>
</html>
