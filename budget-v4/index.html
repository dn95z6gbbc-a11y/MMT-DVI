<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F241C"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../budget/icons/icon-192.png"><title>Мои деньги</title><style>body{margin:0;background:#F4F6F5;color:#102019;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:#fff;border:1px solid #E6EAE8;border-radius:24px;padding:24px;max-width:360px;box-shadow:0 12px 34px rgba(16,32,25,.07)}.logo{width:44px;height:44px;border-radius:15px;background:#0F241C;color:#fff;display:grid;place-items:center;font-weight:850;margin-bottom:16px}h1{margin:0 0 8px;font-size:28px;letter-spacing:-.04em}p{margin:0;color:#6B7872;line-height:1.45}</style></head><body><div class="load"><div class="card"><div class="logo">₽</div><h1>Мои деньги</h1><p id="status">Загружаю приложение…</p></div></div><script>(async()=>{try{const fs=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt','part07.txt','part08.txt'],ps=[];for(const f of fs){const r=await fetch('./app/'+f+'?v=4.0.0',{cache:'no-store'});if(!r.ok)throw new Error(f);ps.push(await r.text())}document.open();document.write(ps.join(''));document.close()}catch(e){document.getElementById('status').textContent='Не удалось загрузить приложение. Обнови страницу.'}})();</script></body></html>
