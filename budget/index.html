<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1B2A25" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Бюджет" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<title>Личный бюджет</title>
<style>
html,body{margin:0;min-height:100%;background:#F1F3F0;color:#1B2A25;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{max-width:420px;background:#FBFCFA;border:1px solid #D4D9D3;border-radius:18px;padding:22px;text-align:center}.box h1{font:700 30px/1 Georgia,serif;margin:0 0 10px}.box p{margin:0;color:#6C7671;line-height:1.45}
</style>
</head>
<body>
<div class="loading"><div class="box"><h1>Личный бюджет</h1><p id="status">Загружаю приложение…</p></div></div>
<script>
(async()=>{
  const files=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt','part07.txt','part08.txt','part09.txt'];
  try{
    const parts=await Promise.all(files.map(async f=>{const r=await fetch('./app/'+f);if(!r.ok)throw new Error(f);return r.text()}));
    document.open();document.write(parts.join(''));document.close();
  }catch(e){
    document.getElementById('status').textContent='Не удалось загрузить приложение. Проверьте интернет и обновите страницу. После первого успешного запуска оно будет работать офлайн.';
  }
})();
</script>
</body>
</html>
