<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;color:#111827;z-index:10}
#loadingBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:460px;text-align:center}
#loadingBox b{display:block;font-size:18px;margin-bottom:6px}
#loadingBox span{display:block;color:#667085;font-size:14px;line-height:1.45}
#app{border:0;width:100%;height:100%;display:none;background:#f4f6fa}
#diag{position:fixed;right:10px;bottom:10px;z-index:20;background:rgba(17,24,39,.92);color:#fff;border-radius:10px;padding:7px 9px;font:11px/1.35 system-ui;display:none}
</style>
</head>
<body>
<div id="loading"><div id="loadingBox"><b>Загружаем V-CHECK…</b><span id="loadText">Получаем основу приложения.</span></div></div>
<iframe id="app" title="V-CHECK"></iframe>
<div id="diag"></div>
<script>
(async function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');
  const loadingBox=document.getElementById('loadingBox');
  const loadText=document.getElementById('loadText');
  const diag=document.getElementById('diag');
  const steps=[];
  const mark=s=>{steps.push(s);diag.textContent=steps.join(' → ');};

  function scriptWithTimeout(src,ms=6000){
    return new Promise(resolve=>{
      const s=document.createElement('script');
      let done=false;
      const finish=state=>{if(done)return;done=true;clearTimeout(timer);mark(state);resolve(state);};
      s.src=src;
      s.async=false;
      s.onload=()=>finish('ok:'+src.split('/').pop());
      s.onerror=()=>finish('err:'+src.split('/').pop());
      const timer=setTimeout(()=>finish('timeout:'+src.split('/').pop()),ms);
      document.body.appendChild(s);
    });
  }

  try{
    mark('start');
    const controller=new AbortController();
    const fetchTimer=setTimeout(()=>controller.abort(),7000);
    const r=await fetch('./index.html?core=21-'+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(fetchTimer);
    if(!r.ok)throw new Error('Не удалось загрузить основу приложения.');
    let html=await r.text();
    mark('index');

    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/g,'');
    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/g,'');
    html=html.replaceAll('Суперсил не даёт. От очевидных косяков перед сдачей спасает.','Сначала V‑CHECK. Потом — преподаватель.');
    html=html.replaceAll('G501-3011','Ж501-311').replaceAll('G502-3011','Ж502-311').replaceAll('G503-3011','Ж503-311');
    html=html.replaceAll('400 МБ','100 МБ').replaceAll('400*1048576','100*1048576');
    html=html.replace('Быстрая проверка выполняется на устройстве.</b><br>Файл не сохраняется. Для будущей содержательной ИИ-проверки будет отдельное согласие на временную отправку файла.','Проверка идёт в два слоя.</b><br>Формальные параметры проверяются автоматически. Текстовые материалы читает YandexGPT. Подкасты расшифровывает SpeechKit. Для видео используются распознавание речи и визуальные кадры. Итоговое решение остаётся за преподавателем.');

    loadText.textContent='Запускаем интерфейс.';
    const d=frame.contentDocument;
    d.open();
    d.write(html);
    d.close();
    mark('written');

    // ВАЖНО: показываем приложение сразу. Дополнительные модули больше не могут оставить белый экран.
    frame.style.display='block';
    loading.style.display='none';
    mark('shown');

    // Критичные подписи страхуем сразу после записи документа.
    const tag=d.querySelector('.hero .tag');
    if(tag)tag.textContent='Сначала V‑CHECK. Потом — преподаватель.';
    const group=d.getElementById('group');
    if(group)group.innerHTML='<option value="">— выберите группу —</option><option>Ж501-311</option><option>Ж502-311</option><option>Ж503-311</option>';

    // Модули догружаются с таймаутом. Даже если Safari подвесит один из них, интерфейс уже открыт.
    const modules=[
      './v3-app-v9.js?v=21',
      './v3-audio-v10.js?v=21',
      './v3-video-frames-v17.js?v=21',
      './v3-video-vision-v16.js?v=21',
      './v3-copy-v10.js?v=21'
    ];
    for(const src of modules)await scriptWithTimeout(src,5000);

    frame.dispatchEvent(new Event('load'));
    mark('modules-fired');

    // Необязательные библиотеки — без ожидания и без влияния на запуск.
    setTimeout(()=>{
      scriptWithTimeout('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',5000);
      scriptWithTimeout('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js',5000)
        .then(()=>scriptWithTimeout('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js',5000))
        .then(()=>scriptWithTimeout('./v3-polish-v11.js?v=21',5000))
        .then(()=>frame.dispatchEvent(new Event('load')));
    },1200);

  }catch(err){
    loadingBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(err&&err.message||err)+'</span>';
    diag.style.display='block';
    mark('fatal');
  }
})();
</script>
</body>
</html>
