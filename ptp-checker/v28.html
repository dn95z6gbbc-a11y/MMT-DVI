<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{border:0;width:100%;height:100%;display:none;background:#f4f6fa}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;z-index:1000}
#loadingBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:500px;text-align:center;color:#111827}
#loadingBox b{display:block;font-size:18px;margin-bottom:6px}
#loadingBox span{display:block;color:#667085;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div id="loading"><div id="loadingBox"><b>Открываем MMT V-CHECK…</b><span>Safari-safe режим: без локального декодирования стоп-кадров.</span></div></div>
<iframe id="app" title="MMT V-CHECK"></iframe>
<script>
(async function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');
  const loadingBox=document.getElementById('loadingBox');

  function childScript(src,timeout=8000){
    return new Promise(resolve=>{
      const d=frame.contentDocument;
      if(!d){resolve(false);return;}
      const s=d.createElement('script');
      let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};
      s.src=src;
      s.async=true;
      s.onload=()=>finish(true);
      s.onerror=()=>finish(false);
      const timer=setTimeout(()=>finish(false),timeout);
      (d.head||d.documentElement).appendChild(s);
    });
  }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const r=await fetch('./index.html?core=28-'+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('Не удалось загрузить основу приложения.');
    let html=await r.text();

    // Убираем всё, что может тяжело стартовать в Safari.
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']\.\/video-frames-direct-v2\.js["']><\/script>/gi,'');

    const d=frame.contentDocument;
    d.open();
    d.write(html);
    d.close();

    if(!d.getElementById('form'))throw new Error('Форма V-CHECK не запустилась.');

    // В этой диагностической версии браузер вообще не декодирует видео по кадрам.
    // Unified-report получает явный сигнал: визуальных данных нет.
    const w=frame.contentWindow;
    w.__VCHECK_VIDEO_FRAMES_STATE__={running:false,target:8,done:0,failed:8};
    w.__VCHECK_VIDEO_FRAMES__=Array.from({length:8},(_,index)=>({index,timeSeconds:null}));
    w.VCHECK_VIDEO_VISION={checked:'0',failed:8,counts:{},person:0,lowerThird:0,subtitles:0,logo:0,locationText:0,frames:[]};

    const materialBox=d.getElementById('materialBox');
    if(materialBox){
      const note=d.createElement('div');
      note.id='safariSafeNote';
      note.style.cssText='margin-top:14px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45';
      note.innerHTML='<b>Safari-safe режим.</b><br>Стоп-кадры на этом устройстве временно не извлекаются, чтобы браузер не зависал. Проверка речи и логики материала работает; визуальные пункты должны отмечаться как «не удалось определить».';
      materialBox.insertAdjacentElement('afterend',note);
    }

    frame.style.display='block';
    loading.style.display='none';

    // Подключаем только объединённый видеоотчёт. Он использует готовую
    // расшифровку тестового ролика и передаёт backend явное отсутствие vision.
    const loaded=await childScript('./video-unified-report-v4.js?v=28',8000);
    if(!loaded)console.warn('Unified video report did not load');
  }catch(err){
    loadingBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(err&&err.message||err)+'</span>';
  }
})();
</script>
</body>
</html>
