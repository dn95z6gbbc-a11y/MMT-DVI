<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa}
iframe{border:0;width:100%;height:100%;display:block;background:#f4f6fa}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js"></script>
<script>
function vcheckCriticalPatch(){
  const frame=document.getElementById('app');
  const d=frame?.contentDocument;
  if(!d||!d.body)return;

  const tag=d.querySelector('.hero .tag');
  if(tag)tag.textContent='Сначала V‑CHECK. Потом — преподаватель.';

  const privacy=d.querySelector('.privacy div');
  if(privacy)privacy.innerHTML='<b>Проверка идёт в два слоя.</b><br>Формальные параметры проверяются автоматически. Текстовые материалы читает YandexGPT. Подкасты сначала расшифровывает SpeechKit, затем YandexGPT анализирует содержание. Для видео подключается анализ речи и визуальных кадров. Итоговое решение остаётся за преподавателем.';

  const group=d.getElementById('group');
  if(group&&group.options.length&&![...group.options].some(o=>o.textContent==='Ж501-311')){
    group.innerHTML='<option value="">— выберите группу —</option><option>Ж501-311</option><option>Ж502-311</option><option>Ж503-311</option>';
  }

  const aiBox=d.querySelector('.ai-box');
  if(aiBox)aiBox.innerHTML='<b>Одна кнопка — две проверки</b>Формальные требования проверяются автоматически. Текст читает YandexGPT, подкасты проходят через SpeechKit, а для видео V-CHECK использует распознавание речи и визуальный анализ кадров. Максимальный размер файла — 100 МБ, максимум — 2 проверки в сутки.';

  function fixLimit(){
    const box=d.getElementById('materialBox');
    if(!box)return;
    for(const node of box.querySelectorAll('.hint')){
      if(node.textContent.includes('400 МБ'))node.textContent=node.textContent.replaceAll('400 МБ','100 МБ');
    }
  }
  fixLimit();

  const box=d.getElementById('materialBox');
  if(box&&!box.dataset.limitObserver18){
    box.dataset.limitObserver18='1';
    new MutationObserver(fixLimit).observe(box,{childList:true,subtree:true,characterData:true});
  }
}
</script>
</head>
<body>
<iframe id="app" src="./index.html?v=18" title="MMT V-CHECK" onload="vcheckCriticalPatch()"></iframe>
<script src="./v3-app-v9.js?v=18"></script>
<script src="./v3-audio-v10.js?v=18"></script>
<script src="./v3-video-frames-v17.js?v=18"></script>
<script src="./v3-video-vision-v16.js?v=18"></script>
<script src="./v3-copy-v10.js?v=18"></script>
<script src="./v3-polish-v11.js?v=18"></script>
<script>
const app=document.getElementById('app');
app.addEventListener('load',()=>{
  vcheckCriticalPatch();
  setTimeout(vcheckCriticalPatch,150);
  setTimeout(vcheckCriticalPatch,700);
});
setTimeout(vcheckCriticalPatch,1000);
</script>
</body>
</html>
