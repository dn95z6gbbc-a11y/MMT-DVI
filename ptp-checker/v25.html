<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{border:0;width:100%;height:100%;display:none;background:#f4f6fa}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;z-index:1000}
#loadingBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:460px;text-align:center;color:#111827}
#loadingBox b{display:block;font-size:18px;margin-bottom:6px}
#loadingBox span{display:block;color:#667085;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div id="loading"><div id="loadingBox"><b>Открываем MMT V-CHECK…</b><span>Готовим лёгкую версию без тяжёлых модулей на старте.</span></div></div>
<iframe id="app" title="MMT V-CHECK"></iframe>
<script>
(async function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');
  const loadingBox=document.getElementById('loadingBox');
  let modulesReady=false;
  let modulesLoading=false;
  let pdfReady=false;

  function parentScript(src,timeout=8000){
    return new Promise(resolve=>{
      const s=document.createElement('script');
      let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};
      s.src=src;
      s.async=false;
      s.onload=()=>finish(true);
      s.onerror=()=>finish(false);
      const timer=setTimeout(()=>finish(false),timeout);
      document.body.appendChild(s);
    });
  }

  function childScript(src,timeout=8000){
    return new Promise(resolve=>{
      const d=frame.contentDocument;
      if(!d){resolve(false);return;}
      const s=d.createElement('script');
      let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};
      s.src=src;
      s.async=true;
      s.onload=()=>finish(true);
      s.onerror=()=>finish(false);
      const timer=setTimeout(()=>finish(false),timeout);
      (d.head||d.documentElement).appendChild(s);
    });
  }

  async function loadMainModules(){
    if(modulesReady||modulesLoading)return;
    modulesLoading=true;
    try{
      const modules=[
        './v3-app-v9.js?v=25',
        './v3-audio-v10.js?v=25',
        './v3-video-frames-v17.js?v=25',
        './v3-video-vision-v16.js?v=25',
        './v3-copy-v10.js?v=25'
      ];
      for(const src of modules)await parentScript(src,7000);
      // Ровно ОДНА инициализация модулей. Повторных load больше нет.
      frame.dispatchEvent(new Event('load'));
      modulesReady=true;
    }finally{
      modulesLoading=false;
    }
  }

  async function loadPdfTools(){
    if(pdfReady)return;
    pdfReady=true;
    const pdf=await parentScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js',7000);
    if(pdf)await parentScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js',7000);
    await parentScript('./v3-polish-v11.js?v=25',7000);
    // v3-polish сам инициализируется, если документ уже готов.
  }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const r=await fetch('./index.html?core=25-'+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('Не удалось загрузить основу приложения.');
    let html=await r.text();

    // Убираем внешние библиотеки, которые раньше могли подвешивать Safari
    // ещё до появления формы. Функциональные модули остаются локальными.
    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/g,'');
    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/g,'');

    const d=frame.contentDocument;
    d.open();
    d.write(html);
    d.close();

    if(!d.getElementById('form'))throw new Error('Форма V-CHECK не запустилась.');

    // Показываем форму СРАЗУ. В этот момент никакие тяжёлые CDN/PDF-модули
    // не загружаются, поэтому ввод текста и select должны оставаться живыми.
    frame.style.display='block';
    loading.style.display='none';

    // Подстраховываем постоянные данные.
    const group=d.getElementById('group');
    if(group)group.innerHTML='<option value="">— выберите группу —</option><option>Ж501-311</option><option>Ж502-311</option><option>Ж503-311</option>';

    // Основные ИИ/медиа-модули подгружаем только после выбора формата.
    // До этого имя, группа и остальные поля ничем не нагружаются.
    const format=d.getElementById('format');
    format?.addEventListener('change',()=>{
      setTimeout(()=>loadMainModules().catch(console.error),0);
    },{once:true});

    // Если пользователь сразу идёт к файлу, тоже гарантируем загрузку модулей.
    d.addEventListener('pointerdown',event=>{
      if(event.target?.id==='materialFile')loadMainModules().catch(console.error);
    },true);

    // DOCX-библиотека нужна только текстовым файлам. Загружаем её по факту.
    d.addEventListener('change',event=>{
      const input=event.target;
      if(input?.id!=='materialFile')return;
      const file=input.files?.[0];
      if(file&&/\.docx$/i.test(file.name||'')){
        childScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',7000);
      }
    },true);

    // PDF-инструменты грузятся только когда отчёт уже появился, а не при вводе формы.
    const report=d.getElementById('report');
    if(report){
      const observer=new MutationObserver(()=>{
        if(getComputedStyle(report).display!=='none'){
          observer.disconnect();
          loadPdfTools().catch(()=>{});
        }
      });
      observer.observe(report,{attributes:true,attributeFilter:['style','class']});
    }

  }catch(err){
    loadingBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(err&&err.message||err)+'</span>';
  }
})();
</script>
</body>
</html>
