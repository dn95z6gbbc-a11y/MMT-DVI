<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{border:0;width:100%;height:100%;display:none;background:#f4f6fa}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;z-index:1000}
#loadingBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:520px;text-align:center;color:#111827}
#loadingBox b{display:block;font-size:18px;margin-bottom:6px}
#loadingBox span{display:block;color:#667085;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div id="loading"><div id="loadingBox"><b>Открываем MMT V-CHECK…</b><span>Видео анализируется на сервере — без декодирования в Safari.</span></div></div>
<iframe id="app" title="MMT V-CHECK"></iframe>
<script>
(async function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');
  const loadingBox=document.getElementById('loadingBox');

  function childScript(src,timeout=10000){
    return new Promise(resolve=>{
      const d=frame.contentDocument;
      if(!d){resolve(false);return;}
      const s=d.createElement('script');
      let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};
      s.src=src;
      s.async=false;
      s.onload=()=>finish(true);
      s.onerror=()=>finish(false);
      const timer=setTimeout(()=>finish(false),timeout);
      (d.head||d.documentElement).appendChild(s);
    });
  }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const r=await fetch('./index.html?core=30-'+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('Не удалось загрузить основу приложения.');
    let html=await r.text();

    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']\.\/video-frames-direct-v2\.js["']><\/script>/gi,'');

    const d=frame.contentDocument;
    d.open();
    d.write(html);
    d.close();

    if(!d.getElementById('form'))throw new Error('Форма V-CHECK не запустилась.');

    frame.style.display='block';
    loading.style.display='none';

    const hideLive=await childScript('./hide-live-format-v1.js?v=68-hide-live',10000);
    const coverage=await childScript('./video-24-frames-v1.js?v=50-universal-video',10000);
    const contactSheets=await childScript('./video-global-contactsheet-v2.js?v=50-universal-video',10000);
    const audioCompat=await childScript('./video-audio-compat-v1.js?v=51-universal-audio',10000);
    const speechAlignedHints=await childScript('./video-speech-aligned-hints-v1.js?v=63-segment-frame-hints',10000);
    const speechExtraCoverage=await childScript('./video-speech-extra-coverage-v1.js?v=66-extra-speech-coverage',10000);
    const speechRoles=await childScript('./video-speech-roles-v1.js?v=61-speech-aligned-roles',10000);
    const engine=await childScript('./video-engine-v5.js?v=52-speech-roles',10000);
    const consistency=await childScript('./video-report-consistency-v1.js?v=54-story-report',10000);
    const consistency2=await childScript('./video-report-consistency-v2.js?v=63-story-hard-guards',10000);
    const semanticGuards=await childScript('./video-story-semantic-guards-v1.js?v=64-story-semantic-guards',10000);
    const storyCleanup=await childScript('./video-story-cleanup-v1.js?v=65-story-cleanup',10000);
    const storyFinalGuards=await childScript('./video-story-final-guards-v1.js?v=66-story-final-guards',10000);
    const storyFinalPolish=await childScript('./video-story-final-polish-v1.js?v=67-story-final-polish',10000);
    const hotFinalGuards=await childScript('./video-hot-final-guards-v1.js?v=69-hot-final-guards',10000);
    const hotRetry=await childScript('./video-hot-retry-v1.js?v=70-hot-retry',10000);
    const storyDiagnostic=await childScript('./video-story-diagnostic-v1.js?v=61-speech-aligned-diagnostic',10000);
    const answerDurationPost=await childScript('./video-answer-duration-post-v1.js?v=50-universal-video',10000);
    const polish=await childScript('./v30-polish.js?v=50-universal-video',10000);

    if(!hideLive)console.warn('V-CHECK live-format hider did not load');
    if(!coverage)console.warn('V-CHECK 24-frame coverage bridge did not load');
    if(!contactSheets)console.warn('V-CHECK contact-sheet bridge did not load');
    if(!audioCompat)console.warn('V-CHECK uploaded-video audio bridge did not load');
    if(!speechAlignedHints)console.warn('V-CHECK speech-aligned hint bridge did not load');
    if(!speechExtraCoverage)console.warn('V-CHECK extra speech coverage bridge did not load');
    if(!speechRoles)console.warn('V-CHECK speech-role bridge did not load');
    if(!engine)console.warn('V-CHECK universal video engine did not load');
    if(!consistency)console.warn('V-CHECK report consistency bridge did not load');
    if(!consistency2)console.warn('V-CHECK strict story consistency guard did not load');
    if(!semanticGuards)console.warn('V-CHECK story semantic guards did not load');
    if(!storyCleanup)console.warn('V-CHECK story cleanup guard did not load');
    if(!storyFinalGuards)console.warn('V-CHECK story final guards did not load');
    if(!storyFinalPolish)console.warn('V-CHECK story final polish did not load');
    if(!hotFinalGuards)console.warn('V-CHECK hot final guards did not load');
    if(!hotRetry)console.warn('V-CHECK hot retry bridge did not load');
    if(!storyDiagnostic)console.warn('V-CHECK story role diagnostic did not load');
    if(!answerDurationPost)console.warn('V-CHECK answer-duration post bridge did not load');
    if(!polish)console.warn('V-CHECK polish did not load');
  }catch(err){
    loadingBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(err&&err.message||err)+'</span>';
  }
})();
</script>
</body>
</html>
