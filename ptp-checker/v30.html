<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#090b0f;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{border:0;width:100%;height:100%;display:none;background:#090b0f}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(237,121,70,.28),transparent 34%),linear-gradient(180deg,#090b0f,#10141a);z-index:1000;padding:20px}
#loadingBox{background:rgba(17,21,27,.92);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:28px 30px;box-shadow:0 28px 90px rgba(0,0,0,.38);max-width:520px;text-align:center;color:#fff;backdrop-filter:blur(18px)}
#loadingBox:before{content:"MMT";display:grid;place-items:center;width:72px;height:52px;margin:0 auto 18px;background:#ed7946;color:#0c0c0c;border-radius:14px;font-weight:900;letter-spacing:-.08em}
#loadingBox b{display:block;font-size:19px;margin-bottom:7px;letter-spacing:-.025em}
#loadingBox span{display:block;color:rgba(255,255,255,.58);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="loading"><div id="loadingBox"><b>Открываем MMT V-CHECK…</b><span>Готовим интерфейс и инструменты проверки.</span></div></div>
<iframe id="app" title="MMT V-CHECK"></iframe>
<script>
(async function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');
  const loadingBox=document.getElementById('loadingBox');

  function childScript(src,timeout=10000){
    return new Promise(resolve=>{
      const d=frame.contentDocument;
      if(!d){resolve(false);return;}
      const s=d.createElement('script');
      let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};
      s.src=src;
      s.async=false;
      s.onload=()=>finish(true);
      s.onerror=()=>finish(false);
      const timer=setTimeout(()=>finish(false),timeout);
      (d.head||d.documentElement).appendChild(s);
    });
  }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const r=await fetch('./index.html?core=30-'+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('Не удалось загрузить основу приложения.');
    let html=await r.text();

    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']\.\/video-frames-direct-v2\.js["']><\/script>/gi,'');

    const d=frame.contentDocument;
    d.open();
    d.write(html);
    d.close();

    if(!d.getElementById('form'))throw new Error('Форма V-CHECK не запустилась.');

    // Build 79: theme is injected inline so it cannot fail because of a delayed CSS asset.
    const theme=d.createElement('style');
    theme.id='mmt-build79-theme';
    theme.textContent=`
      :root{
        --mmt-orange:#ed7946;
        --mmt-orange-hi:#ff9465;
        --mmt-ink:#090b0f;
        --mmt-panel:#11151b;
        --mmt-panel-2:#161b22;
        --mmt-line:#2b323c;
        --mmt-paper:#f5f1e9;
        --mmt-paper-2:#fffdf8;
        --mmt-white:#f7f8fa;
        --mmt-muted:#9aa3af;
        --mmt-green:#31c48d;
        --mmt-red:#ff6b81;
        --mmt-radius:28px;
      }
      *{box-sizing:border-box}
      html{background:#090b0f !important}
      body{
        margin:0 !important;
        color:var(--mmt-white) !important;
        font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif !important;
        background:
          radial-gradient(circle at 14% -8%,rgba(237,121,70,.30),transparent 32%),
          radial-gradient(circle at 92% 12%,rgba(237,121,70,.10),transparent 22%),
          linear-gradient(180deg,#090b0f 0%,#0d1117 52%,#090b0f 100%) !important;
        min-height:100vh;
      }
      ::selection{background:rgba(237,121,70,.34);color:#fff}
      .shell{width:min(1120px,calc(100% - 42px)) !important;margin:auto !important;padding:28px 0 70px !important}
      .top{padding:0 4px 20px !important;color:#fff !important}
      .brand{gap:14px !important;align-items:center !important}
      .mark{
        position:relative !important;width:72px !important;height:52px !important;border-radius:14px !important;
        background:var(--mmt-orange) !important;color:#0b0c0f !important;display:grid !important;place-items:center !important;
        font-size:0 !important;box-shadow:0 14px 36px rgba(237,121,70,.22) !important;overflow:visible !important
      }
      .mark::before{content:"MMT";font-size:21px;font-weight:950;letter-spacing:-.09em}
      .mark::after{content:"";position:absolute;width:11px;height:11px;right:-4px;top:-4px;background:#fff;border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.28)}
      .brand b{color:#fff !important;font-size:18px !important;font-weight:850 !important;letter-spacing:-.035em !important}
      .brand small{display:block !important;color:rgba(255,255,255,.46) !important;margin-top:3px !important;font-size:12px !important}

      .card{
        border-radius:var(--mmt-radius) !important;margin:18px 0 !important;padding:30px !important;
        border:1px solid rgba(255,255,255,.075) !important;background:linear-gradient(180deg,#12171e,#0f141a) !important;
        color:var(--mmt-white) !important;box-shadow:0 26px 80px rgba(0,0,0,.26) !important;overflow:hidden !important
      }
      .hero{
        position:relative !important;min-height:430px !important;padding:54px 52px !important;
        background:
          linear-gradient(110deg,rgba(255,255,255,.06),transparent 34%),
          linear-gradient(135deg,var(--mmt-orange-hi) 0%,var(--mmt-orange) 58%,#d86131 100%) !important;
        color:#0b0c0f !important;border-color:rgba(255,255,255,.20) !important
      }
      .hero::before{content:"MMT";position:absolute;right:-14px;bottom:-64px;font-size:190px;font-weight:950;letter-spacing:-.11em;line-height:1;color:rgba(8,9,12,.08);pointer-events:none}
      .hero::after{content:"";position:absolute;right:48px;top:46px;width:18px;height:18px;background:#0b0c0f;border-radius:3px}
      .hero>*{position:relative;z-index:1;max-width:760px}
      .eyebrow{
        display:inline-flex !important;background:#0c0d10 !important;color:#fff !important;border:1px solid rgba(0,0,0,.08) !important;
        border-radius:999px !important;padding:8px 12px !important;font-size:11px !important;font-weight:850 !important;
        letter-spacing:.09em !important;text-transform:uppercase !important
      }
      .hero h1{color:#0b0c0f !important;font-size:clamp(56px,8.6vw,92px) !important;line-height:.86 !important;letter-spacing:-.075em !important;font-weight:900 !important;margin:26px 0 18px !important}
      .hero .tag{color:#14110f !important;font-size:clamp(20px,2.6vw,29px) !important;line-height:1.16 !important;font-weight:720 !important;letter-spacing:-.035em !important;margin-bottom:18px !important}
      .hero .note{color:rgba(15,12,10,.67) !important;font-size:15px !important;line-height:1.6 !important;max-width:700px !important}
      .hero .privacy{
        margin-top:30px !important;background:rgba(8,9,12,.88) !important;color:rgba(255,255,255,.72) !important;
        border:1px solid rgba(255,255,255,.10) !important;border-radius:20px !important;padding:16px 18px !important;backdrop-filter:blur(14px)
      }
      .hero .privacy b{color:#fff !important}

      form>.card{background:linear-gradient(180deg,#12171e,#0e1319) !important}
      .section-title{margin-bottom:24px !important;gap:14px !important}
      .step{width:42px !important;height:42px !important;border-radius:13px !important;background:var(--mmt-orange) !important;color:#0b0c0f !important;font-weight:900 !important;box-shadow:0 10px 24px rgba(237,121,70,.18) !important}
      .section-title h2{color:#fff !important;font-size:24px !important;letter-spacing:-.04em !important;font-weight:820 !important;margin:0 !important}
      .section-title p{color:var(--mmt-muted) !important;margin-top:4px !important}
      .grid{gap:18px !important}
      .field{gap:8px !important;margin:11px 0 !important}
      .field>span{color:#d8dde5 !important;font-size:12px !important;text-transform:uppercase !important;letter-spacing:.07em !important;font-weight:800 !important}
      .field small,.hint{color:#7f8996 !important}

      input,select,textarea{
        width:100% !important;border:1px solid #29313a !important;background:#0a0e13 !important;color:#f7f8fa !important;
        border-radius:16px !important;padding:14px 15px !important;outline:none !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025) !important;
        transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease,background .18s ease !important
      }
      input::placeholder,textarea::placeholder{color:#626b77 !important}
      select{color-scheme:dark !important}
      input:hover,select:hover,textarea:hover{border-color:#3a4654 !important;background:#0c1117 !important}
      input:focus,select:focus,textarea:focus{border-color:var(--mmt-orange) !important;box-shadow:0 0 0 4px rgba(237,121,70,.14) !important;background:#0b1016 !important}
      textarea{min-height:118px !important}

      .check{border:1px solid #29313a !important;background:#0b1016 !important;border-radius:18px !important;padding:16px !important;color:#e8ebef !important}
      .check small{color:#7e8895 !important}
      .check input{width:20px !important;height:20px !important;accent-color:var(--mmt-orange) !important}
      .upload{border:1px dashed rgba(237,121,70,.65) !important;background:linear-gradient(180deg,rgba(237,121,70,.075),rgba(8,12,16,.58)) !important;border-radius:20px !important;padding:20px !important}
      .upload input[type=file]{background:#090d12 !important;border-color:#242d37 !important}
      .meta{gap:8px !important}
      .chip{background:rgba(237,121,70,.14) !important;color:#ffad89 !important;border:1px solid rgba(237,121,70,.20) !important;border-radius:999px !important;padding:6px 10px !important;font-size:11px !important;font-weight:760 !important}
      .privacy{background:#0b1016 !important;border-color:#28313b !important;color:#cbd2da !important;border-radius:18px !important}
      .ai-box{background:linear-gradient(135deg,rgba(237,121,70,.16),rgba(237,121,70,.07)) !important;border:1px solid rgba(237,121,70,.28) !important;color:#ffd4c2 !important;border-radius:20px !important;padding:17px !important}
      .ai-box b{color:#fff !important}

      .actions{gap:12px !important}
      .btn{border-radius:15px !important;padding:13px 18px !important;min-height:46px !important;font-weight:850 !important;letter-spacing:-.02em !important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease !important}
      .btn:hover{transform:translateY(-1px) !important}
      .primary{background:var(--mmt-orange) !important;color:#0b0c0f !important;box-shadow:0 12px 28px rgba(237,121,70,.20) !important}
      .accent{background:var(--mmt-orange) !important;color:#0b0c0f !important;box-shadow:0 12px 28px rgba(237,121,70,.20) !important}
      .ghost{background:#171d24 !important;border:1px solid #303944 !important;color:#edf0f4 !important}

      #report.card{background:linear-gradient(180deg,var(--mmt-paper-2),var(--mmt-paper)) !important;color:#12151a !important;border-color:rgba(255,255,255,.16) !important}
      #report .eyebrow{background:#101318 !important;color:#fff !important}
      #reportTitle{color:#101318 !important;font-size:34px !important;letter-spacing:-.05em !important;font-weight:860 !important;margin-top:15px !important}
      #reportMeta{color:#767d86 !important;margin-bottom:20px !important}
      #report .block{border-radius:19px !important;padding:18px 19px !important;margin:12px 0 !important}
      #report .bad{background:#fff0f2 !important;border:1px solid rgba(180,35,61,.16) !important;color:#7a1730 !important}
      #report .good{background:#eaf8f2 !important;border:1px solid rgba(19,121,91,.15) !important;color:#155b46 !important}
      #report .neutral{background:#eceff2 !important;border:1px solid rgba(12,12,12,.08) !important;color:#343941 !important}
      #report .final{background:#101318 !important;color:#fff !important;border-radius:19px !important;padding:18px 19px !important}
      #report .ghost{background:#fff !important;border:1px solid rgba(12,12,12,.12) !important;color:#171a1f !important}

      #vcheckUnifiedVideoReport{margin-top:20px !important;background:linear-gradient(180deg,#fffdf8,#f5f1e9) !important;border:1px solid rgba(12,12,12,.08) !important;border-radius:24px !important;box-shadow:0 20px 55px rgba(0,0,0,.10) !important;overflow:hidden !important}
      #vcheckUnifiedVideoReport h2,#vcheckUnifiedVideoReport h3,#vcheckUnifiedVideoReport h4{color:#14171b !important;letter-spacing:-.035em !important}
      #vcheckUnifiedVideoReport p,#vcheckUnifiedVideoReport li{color:#3a4048 !important;line-height:1.64 !important}
      #vcheckUnifiedVideoProgress{margin-top:14px !important;background:#101318 !important;border:1px solid #252b33 !important;color:#dfe4ea !important;border-radius:18px !important;padding:16px 18px !important}
      #vcheckUnifiedVideoProgress b{color:#ff9a70 !important}

      .footer{color:rgba(255,255,255,.28) !important;padding:24px 10px 8px !important;letter-spacing:.025em !important}

      @media(max-width:680px){
        .shell{width:min(100% - 16px,1120px) !important;padding-top:12px !important}
        .top{padding:0 4px 12px !important}
        .mark{width:62px !important;height:46px !important}
        .card{padding:20px !important;border-radius:22px !important;margin:11px 0 !important}
        .hero{padding:34px 24px 30px !important;min-height:390px !important}
        .hero h1{font-size:56px !important}
        .hero::before{font-size:120px !important;bottom:-38px !important}
        .hero .privacy{margin-top:24px !important}
        .section-title h2{font-size:21px !important}
        .actions .btn{flex:1 1 140px !important}
        #reportTitle{font-size:28px !important}
      }
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none !important}}
    `;
    (d.head||d.documentElement).appendChild(theme);

    frame.style.display='block';
    loading.style.display='none';

    const hideLive=await childScript('./hide-live-format-v1.js?v=68-hide-live',10000);
    const coverage=await childScript('./video-24-frames-v1.js?v=50-universal-video',10000);
    const contactSheets=await childScript('./video-global-contactsheet-v2.js?v=50-universal-video',10000);
    const audioCompat=await childScript('./video-audio-compat-v1.js?v=51-universal-audio',10000);
    const speechAlignedHints=await childScript('./video-speech-aligned-hints-v1.js?v=63-segment-frame-hints',10000);
    const speechExtraCoverage=await childScript('./video-speech-extra-coverage-v1.js?v=66-extra-speech-coverage',10000);
    const speechRoles=await childScript('./video-speech-roles-v1.js?v=61-speech-aligned-roles',10000);
    const engine=await childScript('./video-engine-v5.js?v=52-speech-roles',10000);
    const consistency=await childScript('./video-report-consistency-v1.js?v=54-story-report',10000);
    const consistency2=await childScript('./video-report-consistency-v2.js?v=63-story-hard-guards',10000);
    const semanticGuards=await childScript('./video-story-semantic-guards-v1.js?v=64-story-semantic-guards',10000);
    const storyCleanup=await childScript('./video-story-cleanup-v1.js?v=65-story-cleanup',10000);
    const storyFinalGuards=await childScript('./video-story-final-guards-v1.js?v=66-story-final-guards',10000);
    const storyFinalPolish=await childScript('./video-story-final-polish-v1.js?v=67-story-final-polish',10000);
    const hotFinalGuards=await childScript('./video-hot-final-guards-v1.js?v=75-hot-final-guards-v2',10000);
    const hotRetry=await childScript('./video-hot-retry-v4.js?v=73-hot-compact-retry',10000);
    const hotFinalPolish=await childScript('./video-hot-final-polish-v1.js?v=76-hot-final-polish',10000);
    const hotFinalCleanup=await childScript('./video-hot-final-cleanup-v1.js?v=77-hot-final-cleanup',10000);
    const storyDiagnostic=await childScript('./video-story-diagnostic-v1.js?v=61-speech-aligned-diagnostic',10000);
    const answerDurationPost=await childScript('./video-answer-duration-post-v1.js?v=50-universal-video',10000);
    const polish=await childScript('./v30-polish.js?v=50-universal-video',10000);

    if(!hideLive)console.warn('V-CHECK live-format hider did not load');
    if(!coverage)console.warn('V-CHECK 24-frame coverage bridge did not load');
    if(!contactSheets)console.warn('V-CHECK contact-sheet bridge did not load');
    if(!audioCompat)console.warn('V-CHECK uploaded-video audio bridge did not load');
    if(!speechAlignedHints)console.warn('V-CHECK speech-aligned hint bridge did not load');
    if(!speechExtraCoverage)console.warn('V-CHECK extra speech coverage bridge did not load');
    if(!speechRoles)console.warn('V-CHECK speech-role bridge did not load');
    if(!engine)console.warn('V-CHECK universal video engine did not load');
    if(!consistency)console.warn('V-CHECK report consistency bridge did not load');
    if(!consistency2)console.warn('V-CHECK strict story consistency guard did not load');
    if(!semanticGuards)console.warn('V-CHECK story semantic guards did not load');
    if(!storyCleanup)console.warn('V-CHECK story cleanup guard did not load');
    if(!storyFinalGuards)console.warn('V-CHECK story final guards did not load');
    if(!storyFinalPolish)console.warn('V-CHECK story final polish did not load');
    if(!hotFinalGuards)console.warn('V-CHECK hot final guards v2 did not load');
    if(!hotRetry)console.warn('V-CHECK hot compact retry v4 bridge did not load');
    if(!hotFinalPolish)console.warn('V-CHECK hot final polish did not load');
    if(!hotFinalCleanup)console.warn('V-CHECK hot final cleanup did not load');
    if(!storyDiagnostic)console.warn('V-CHECK story role diagnostic did not load');
    if(!answerDurationPost)console.warn('V-CHECK answer-duration post bridge did not load');
    if(!polish)console.warn('V-CHECK polish did not load');
  }catch(err){
    loadingBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(err&&err.message||err)+'</span>';
  }
})();
</script>
</body>
</html>
