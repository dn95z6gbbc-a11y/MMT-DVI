<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa}
iframe{border:0;width:100%;height:100%;display:block}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;color:#475569;font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;z-index:2}
#boot[hidden]{display:none}
</style>
</head>
<body>
<div id="boot">Загружаем MMT V-CHECK…</div>
<iframe id="app" src="about:blank" title="MMT V-CHECK"></iframe>
<script src="./v3-audio-v10.js?v=18"></script>
<script src="./v3-video-frames-v17.js?v=18"></script>
<script src="./v3-video-vision-v16.js?v=18"></script>
<script src="./v3-app-v9.js?v=18"></script>
<script src="./v3-copy-v10.js?v=18"></script>
<script>
(function(){
  const app=document.getElementById('app');
  const boot=document.getElementById('boot');

  function loadScript(targetDoc,src){
    return new Promise((resolve,reject)=>{
      const s=targetDoc.createElement('script');
      s.src=src;
      s.async=true;
      s.onload=()=>resolve();
      s.onerror=()=>reject(new Error('Не загрузился '+src));
      (targetDoc.head||targetDoc.documentElement).appendChild(s);
    });
  }

  function loadOptionalLibraries(){
    const d=app.contentDocument;
    if(!d)return;

    // Эти библиотеки нужны только для DOCX/старого PDF и не должны
    // задерживать появление самого приложения.
    loadScript(d,'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js').catch(()=>{});
    loadScript(d,'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js').catch(()=>{});

    // PDFMake используется новым экспортом отчёта. Загружаем в фоне,
    // уже после появления интерфейса.
    loadScript(document,'https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js')
      .then(()=>loadScript(document,'https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js'))
      .catch(()=>{});
  }

  app.addEventListener('load',()=>{
    if(boot)boot.hidden=true;

    const s=document.createElement('script');
    s.src='./v3-polish-v11.js?v=18';
    document.body.appendChild(s);

    setTimeout(loadOptionalLibraries,0);
  },{once:true});

  fetch('./index.html?v=18',{cache:'no-store'})
    .then(r=>{
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.text();
    })
    .then(html=>{
      // Внутри старого index.html CDN-скрипты стояли в <head> и могли
      // держать Safari на белом экране. Убираем их из стартовой разметки:
      // они подгрузятся в фоне после запуска интерфейса.
      html=html
        .replace(/<script\s+src="https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth@1\.8\.0\/mammoth\.browser\.min\.js"><\/script>/i,'')
        .replace(/<script\s+src="https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf\.js@0\.10\.1\/dist\/html2pdf\.bundle\.min\.js"><\/script>/i,'');
      app.srcdoc=html;
    })
    .catch(err=>{
      console.error('V-CHECK bootstrap failed:',err);
      if(boot)boot.textContent='Не удалось загрузить интерфейс V-CHECK. Обновите страницу.';
    });
})();
</script>
</body>
</html>
