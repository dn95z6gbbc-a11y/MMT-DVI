<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{border:0;width:100%;height:100%;display:none;background:#f4f6fa}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;z-index:1000}
#loadingBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:520px;text-align:center;color:#111827}
#loadingBox b{display:block;font-size:18px;margin-bottom:6px}
#loadingBox span{display:block;color:#667085;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div id="loading"><div id="loadingBox"><b>Открываем MMT V-CHECK…</b><span>Видео анализируется через облачные стоп-кадры — без декодирования в Safari.</span></div></div>
<iframe id="app" title="MMT V-CHECK"></iframe>
<script>
(async function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');
  const loadingBox=document.getElementById('loadingBox');

  function childScript(src,timeout=10000){
    return new Promise(resolve=>{
      const d=frame.contentDocument;
      if(!d){resolve(false);return;}
      const s=d.createElement('script');
      let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};
      s.src=src;
      s.async=false;
      s.onload=()=>finish(true);
      s.onerror=()=>finish(false);
      const timer=setTimeout(()=>finish(false),timeout);
      (d.head||d.documentElement).appendChild(s);
    });
  }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const r=await fetch('./index.html?core=29-'+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('Не удалось загрузить основу приложения.');
    let html=await r.text();

    // Никакого локального декодирования видео и тяжёлых CDN на старте.
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']\.\/video-frames-direct-v2\.js["']><\/script>/gi,'');

    const d=frame.contentDocument;
    d.open();
    d.write(html);
    d.close();

    if(!d.getElementById('form'))throw new Error('Форма V-CHECK не запустилась.');

    frame.style.display='block';
    loading.style.display='none';

    // Сначала облачная визуальная подготовка, затем единый отчёт и полировка.
    const cloud=await childScript('./v29-cloud-vision.js?v=29',10000);
    const unified=await childScript('./video-unified-report-v4.js?v=29',10000);
    const polish=await childScript('./v29-polish.js?v=29',10000);

    if(!cloud)console.warn('V-CHECK cloud vision bridge did not load');
    if(!unified)console.warn('V-CHECK unified report did not load');
    if(!polish)console.warn('V-CHECK polish did not load');
  }catch(err){
    loadingBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(err&&err.message||err)+'</span>';
  }
})();
</script>
</body>
</html>
