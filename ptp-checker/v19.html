<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;color:#111827;z-index:10}
#loadingBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:420px;text-align:center}
#loadingBox b{display:block;font-size:18px;margin-bottom:6px}
#loadingBox span{color:#667085;font-size:14px}
#app{border:0;width:100%;height:100%;display:none;background:#f4f6fa}
</style>
</head>
<body>
<div id="loading"><div id="loadingBox"><b>Загружаем V-CHECK…</b><span>Подготавливаем интерфейс без старого кэша Safari.</span></div></div>
<iframe id="app" title="V-CHECK"></iframe>

<script src="./v3-app-v9.js?v=19"></script>
<script src="./v3-audio-v10.js?v=19"></script>
<script src="./v3-video-frames-v17.js?v=19"></script>
<script src="./v3-video-vision-v16.js?v=19"></script>
<script src="./v3-copy-v10.js?v=19"></script>

<script>
(async function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');
  const loadingBox=document.getElementById('loadingBox');

  function loadScriptInto(targetDoc,src){
    return new Promise(resolve=>{
      const s=targetDoc.createElement('script');
      s.src=src;
      s.async=true;
      s.onload=resolve;
      s.onerror=resolve;
      targetDoc.head.appendChild(s);
    });
  }

  function loadParentScript(src){
    return new Promise(resolve=>{
      const s=document.createElement('script');
      s.src=src;
      s.async=true;
      s.onload=resolve;
      s.onerror=resolve;
      document.head.appendChild(s);
    });
  }

  try{
    const r=await fetch('./index.html?core=19-'+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Не удалось загрузить основу приложения');
    let html=await r.text();

    // Не даём внешним CDN блокировать первый экран Safari.
    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/g,'');
    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/g,'');

    // Критичные правки встраиваем до первого рендера, без гонки патчей.
    html=html.replaceAll('Суперсил не даёт. От очевидных косяков перед сдачей спасает.','Сначала V‑CHECK. Потом — преподаватель.');
    html=html.replaceAll('G501-3011','Ж501-311').replaceAll('G502-3011','Ж502-311').replaceAll('G503-3011','Ж503-311');
    html=html.replaceAll('400 МБ','100 МБ').replaceAll('400*1048576','100*1048576');
    html=html.replace('Быстрая проверка выполняется на устройстве.</b><br>Файл не сохраняется. Для будущей содержательной ИИ-проверки будет отдельное согласие на временную отправку файла.','Проверка идёт в два слоя.</b><br>Формальные параметры проверяются автоматически. Текстовые материалы читает YandexGPT. Подкасты расшифровывает SpeechKit. Для видео используется анализ речи и визуальных кадров. Итоговое решение остаётся за преподавателем.');

    let loaded=false;
    frame.addEventListener('load',async()=>{
      if(loaded)return;
      loaded=true;
      frame.style.display='block';
      loading.style.display='none';

      const d=frame.contentDocument;
      // Необязательные библиотеки грузим уже после показа интерфейса.
      loadScriptInto(d,'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
      loadParentScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js').then(()=>loadParentScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js')).then(()=>loadParentScript('./v3-polish-v11.js?v=19'));
    },{once:true});

    frame.srcdoc=html;

    setTimeout(()=>{
      if(loaded)return;
      loadingBox.innerHTML='<b>V-CHECK загружается дольше обычного</b><span>Закройте эту вкладку и откройте ссылку ещё раз. Если экран снова зависнет, пришлите скрин — теперь ошибка будет локализована в одном месте.</span>';
    },12000);
  }catch(err){
    loadingBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(err&&err.message||err)+'</span>';
  }
})();
</script>
</body>
</html>
