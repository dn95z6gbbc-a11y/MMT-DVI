<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-CHECK</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;color:#111827;z-index:9999}
#bootBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:460px;text-align:center}
#bootBox b{display:block;font-size:18px;margin-bottom:6px}
#bootBox span{display:block;color:#667085;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div id="boot"><div id="bootBox"><b>Открываем V-CHECK…</b><span>Запускаем стабильную версию без iframe.</span></div></div>
<script>
(async function(){
  const bootBox=document.getElementById('bootBox');
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const response=await fetch('./index.html?standalone=22-'+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!response.ok)throw new Error('Не удалось получить основу приложения.');
    let html=await response.text();

    // Убираем блокирующие внешние библиотеки из старой основы.
    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/g,'');
    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/g,'');

    // Актуальные постоянные тексты и ограничения сразу в основном документе.
    html=html.replaceAll('Суперсил не даёт. От очевидных косяков перед сдачей спасает.','Сначала V‑CHECK. Потом — преподаватель.');
    html=html.replaceAll('G501-3011','Ж501-311').replaceAll('G502-3011','Ж502-311').replaceAll('G503-3011','Ж503-311');
    html=html.replaceAll('400 МБ','100 МБ').replaceAll('400*1048576','100*1048576');
    html=html.replace('Быстрая проверка выполняется на устройстве.</b><br>Файл не сохраняется. Для будущей содержательной ИИ-проверки будет отдельное согласие на временную отправку файла.','Проверка идёт в два слоя.</b><br>Формальные параметры проверяются автоматически. Текстовые материалы читает YandexGPT. Подкасты расшифровывает SpeechKit. Для видео используются распознавание речи и визуальные кадры. Итоговое решение остаётся за преподавателем.');

    const standaloneScripts=`
<div id="app" hidden aria-hidden="true"></div>
<script>
(function(){
  const host=document.getElementById('app');
  Object.defineProperty(host,'contentDocument',{configurable:true,get:()=>document});
  Object.defineProperty(host,'contentWindow',{configurable:true,get:()=>window});
  window.__VCHECK_STANDALONE__=true;
})();
<\/script>
<script src="./v3-app-v9.js?v=22"><\/script>
<script src="./v3-audio-v10.js?v=22"><\/script>
<script src="./v3-video-frames-v17.js?v=22"><\/script>
<script src="./v3-video-vision-v16.js?v=22"><\/script>
<script src="./v3-copy-v10.js?v=22"><\/script>
<script src="./v3-polish-v11.js?v=22"><\/script>
<script>
(function(){
  const host=document.getElementById('app');
  host.dispatchEvent(new Event('load'));

  function loadScript(src){
    return new Promise(resolve=>{
      const s=document.createElement('script');
      s.src=src;s.async=true;
      s.onload=()=>resolve(true);s.onerror=()=>resolve(false);
      document.body.appendChild(s);
    });
  }

  // Эти библиотеки не блокируют открытие приложения.
  setTimeout(async()=>{
    await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
    const pdf=await loadScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js');
    if(pdf)await loadScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js');
  },250);
})();
<\/script>`;

    html=html.replace('</body>',standaloneScripts+'\n</body>');

    // ВАЖНО: заменяем весь верхний документ. Никакого iframe больше нет.
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    bootBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(error&&error.message||error)+'</span>';
  }
})();
</script>
</body>
</html>
