<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;color:#111827;z-index:9999}
#bootBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:460px;text-align:center}
#bootBox b{display:block;font-size:18px;margin-bottom:6px}
#bootBox span{display:block;color:#667085;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div id="boot"><div id="bootBox"><b>Открываем MMT V-CHECK…</b><span>Запускаем интерфейс и элементы формы.</span></div></div>
<script>
(async function(){
  const bootBox=document.getElementById('bootBox');

  function appendInline(code){
    const s=document.createElement('script');
    s.textContent=code;
    document.body.appendChild(s);
  }

  function loadScript(src){
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=src;
      s.async=false;
      s.onload=()=>resolve(true);
      s.onerror=()=>reject(new Error('Не загрузился '+src));
      document.body.appendChild(s);
    });
  }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),10000);
    const response=await fetch('./index.html?standalone=23-'+Date.now(),{
      cache:'no-store',
      signal:controller.signal
    });
    clearTimeout(timer);
    if(!response.ok)throw new Error('Не удалось получить основу приложения: HTTP '+response.status);

    let html=await response.text();
    const inlineScripts=[];
    const localScripts=[];

    // В v22 разметка отображалась, но Safari не исполнял скрипты,
    // пришедшие внутрь document.write. Здесь извлекаем их и запускаем явно.
    html=html.replace(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi,(full,attrs,body)=>{
      const srcMatch=String(attrs||'').match(/\bsrc=["']([^"']+)["']/i);
      if(srcMatch){
        const src=srcMatch[1];
        if(/^https:\/\/cdn\.jsdelivr\.net\//i.test(src))return '';
        localScripts.push(src);
        return '';
      }
      if(String(body||'').trim())inlineScripts.push(body);
      return '';
    });

    // Добавляем совместимый "app"-host для модулей v3, но сам интерфейс
    // остаётся обычной страницей без iframe.
    html=html.replace('</body>','<div id="app" hidden aria-hidden="true"></div>\n</body>');

    document.open();
    document.write(html);
    document.close();

    const host=document.getElementById('app');
    if(!host)throw new Error('Не создан контейнер приложения.');
    Object.defineProperty(host,'contentDocument',{configurable:true,get:()=>document});
    Object.defineProperty(host,'contentWindow',{configurable:true,get:()=>window});
    window.__VCHECK_STANDALONE__=true;

    // Сначала запускаем родную логику index.html: именно она заполняет
    // выпадающий список форматов и создаёт поле загрузки материала.
    for(const code of inlineScripts)appendInline(code);

    // Затем — локальные скрипты, которые были подключены в index.html.
    for(const src of localScripts){
      if(/mammoth|html2pdf/i.test(src))continue;
      await loadScript(src+(src.includes('?')?'&':'?')+'v23='+Date.now());
    }

    // Актуальные надстройки V-CHECK. Они ждут события load на #app.
    const modules=[
      './v3-audio-v10.js?v=23',
      './v3-video-frames-v17.js?v=23',
      './v3-video-vision-v16.js?v=23',
      './v3-app-v9.js?v=23',
      './v3-copy-v10.js?v=23',
      './v3-polish-v11.js?v=23'
    ];
    for(const src of modules)await loadScript(src);

    host.dispatchEvent(new Event('load'));

    // Проверяем, что базовая логика действительно ожила.
    const format=document.getElementById('format');
    if(!format||format.options.length<2){
      throw new Error('Не удалось инициализировать выпадающие списки.');
    }

    // Внешние библиотеки нужны только при работе с DOCX/PDF.
    // Они не участвуют в старте приложения и подгружаются в фоне.
    setTimeout(async()=>{
      try{await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');}catch(_){}
      try{await loadScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js');}catch(_){}
      try{
        await loadScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js');
        await loadScript('https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js');
      }catch(_){}
    },300);
  }catch(error){
    const message=String(error&&error.message||error);
    const box=document.getElementById('bootBox')||bootBox;
    if(box)box.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+message+'</span>';
    console.error('V-CHECK v23 bootstrap failed',error);
  }
})();
</script>
</body>
</html>
