<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMT V-CHECK</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{border:0;width:100%;height:100%;display:none;background:#f4f6fa}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;z-index:1000}
#loadingBox{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.08);max-width:480px;text-align:center;color:#111827}
#loadingBox b{display:block;font-size:18px;margin-bottom:6px}
#loadingBox span{display:block;color:#667085;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div id="loading"><div id="loadingBox"><b>Открываем MMT V-CHECK…</b><span>Запускаем Safari-safe версию без двойного анализа кадров.</span></div></div>
<iframe id="app" title="MMT V-CHECK"></iframe>
<script>
(async function(){
  const frame=document.getElementById('app');
  const loading=document.getElementById('loading');
  const loadingBox=document.getElementById('loadingBox');
  let modulesReady=false;
  let modulesLoading=false;

  function parentScript(src,timeout=8000){
    return new Promise(resolve=>{
      const s=document.createElement('script');
      let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};
      s.src=src;
      s.async=false;
      s.onload=()=>finish(true);
      s.onerror=()=>finish(false);
      const timer=setTimeout(()=>finish(false),timeout);
      document.body.appendChild(s);
    });
  }

  async function loadModulesForFile(file){
    if(modulesReady||modulesLoading||!file)return;
    modulesLoading=true;
    try{
      const isVideo=String(file.type||'').startsWith('video/')||/\.(mp4|mov|m4v|webm)$/i.test(file.name||'');
      const isAudio=String(file.type||'').startsWith('audio/')||/\.(mp3|wav|m4a|aac|ogg)$/i.test(file.name||'');

      const modules=['./v3-app-v9.js?v=27'];
      if(isVideo){
        // Только ОДИН обработчик кадров. Старый direct-v2 из index.html
        // удалён до запуска страницы.
        modules.push('./v3-video-frames-v18.js?v=27');
        modules.push('./v3-video-vision-v16.js?v=27');
      }else if(isAudio){
        modules.push('./v3-audio-v10.js?v=27');
      }
      modules.push('./v3-copy-v10.js?v=27');

      for(const src of modules)await parentScript(src,8000);

      // Модули подписались на load iframe — инициализируем один раз.
      frame.dispatchEvent(new Event('load'));
      modulesReady=true;

      // Файл был выбран до подключения модулей. Повторяем change один раз,
      // чтобы его увидел новый облегчённый обработчик.
      const d=frame.contentDocument;
      const input=d?.getElementById('materialFile');
      if(input)input.dispatchEvent(new Event('change',{bubbles:true}));
    }finally{
      modulesLoading=false;
    }
  }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    const r=await fetch('./index.html?core=27-'+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('Не удалось загрузить основу приложения.');
    let html=await r.text();

    // Не даём CDN блокировать первый экран Safari.
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/mammoth[^>]*><\/script>/gi,'');
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/html2pdf[^>]*><\/script>/gi,'');

    // КЛЮЧЕВОЙ FIX: в index.html оставался старый video-frames-direct-v2.js,
    // который параллельно с новым модулем открывал 52 МБ видео снова и снова.
    // На Safari это и подвешивало вкладку. Удаляем его из этой версии.
    html=html.replace(/<script\s+src=["']\.\/video-frames-direct-v2\.js["']><\/script>/gi,'');

    const d=frame.contentDocument;
    d.open();
    d.write(html);
    d.close();

    if(!d.getElementById('form'))throw new Error('Форма V-CHECK не запустилась.');

    frame.style.display='block';
    loading.style.display='none';

    if(d.documentElement.dataset.vcheck27!=='1'){
      d.documentElement.dataset.vcheck27='1';
      d.addEventListener('change',event=>{
        const input=event.target;
        if(input?.id!=='materialFile')return;
        const file=input.files?.[0];
        if(!file)return;
        // Небольшая пауза: Safari завершает собственную обработку file input.
        setTimeout(()=>loadModulesForFile(file).catch(console.error),400);
      },true);
    }
  }catch(err){
    loadingBox.innerHTML='<b>Не удалось открыть V-CHECK</b><span>'+String(err&&err.message||err)+'</span>';
  }
})();
</script>
</body>
</html>
